
<html> 
<head> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title> 
    <link rel="stylesheet" href="flasktest-camStyle.css"> 
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head> 
<body> 
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">Blue Cheese Robotics</div>
            <button class="hamburger" onclick="toggleMenu()">&#9776;</button>
            <ul class="nav-menu">
                <li><a href="../index.html" class="nav-link">Home</a></li>
                <li><a href="../flasktest-information.html" class="nav-link">Information</a></li>
                <li><a href="flasktest-camera.html" class="nav-link active">Camera</a></li>
                <li><a href="../admin/flasktest-admin.html" class="nav-link">Admin Panel</a></li>
                <li class="mobile-only"><a href="../flasktest-profile.html" class="nav-link nav-logout">Profile</a></li>
                <li class="mobile-only"><a href="../flasktest-auth.html" class="nav-link nav-logout">Sign In</a></li>
            </ul>
            <a href="../flasktest-profile.html" id="nav-profile" class="nav-link nav-logout desktop-only">Profile</a>
            <a href="../flasktest-auth.html" id="nav-signin" class="nav-link nav-logout desktop-only">Sign In</a>
        </div>
    </nav>
    <video id="cameraFeed" autoplay></video> 
    <div id="reader"></div>
    <div id="result"></div>
     
    <script>
        function toggleMenu() {
            const navMenu = document.querySelector('.nav-menu');
            navMenu.classList.toggle('open');
        }

        const isMobile = window.innerWidth <= 768;
        const qrBoxSize = isMobile ? 200 : 250;

        const scanner = new Html5QrcodeScanner('reader', {
        qrbox: {
            width: qrBoxSize,
            height: qrBoxSize,
        },
        fps: 20, 
    });
       

        scanner.render(success, error); 

        function success(result) { 
            
            document.getElementById('result').innerHTML = `
                <h2>Success!</h2>
                <p><a href="${result}">${result}</a></p>
            `;
            scanner.clear();
            
            document.getElementById('reader').remove();
        }

        function error (err){
            console.error(err)
        }
        </script>
</body> 
</html>
