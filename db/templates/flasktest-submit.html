<!DOCTYPE html>
<html lang="en">
<head>
    <!-- basic setup -->
    <meta charset="UTF-8">
    
    <!-- responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- page title -->
    <title>Check In</title>
    
    <!-- css -->
    <link rel="stylesheet" href="./static/flasktest-style.css">
    
    <!-- font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <!-- navbar -->
    <nav class="navbar">
        <div class="nav-container">
            
            <!-- brand name -->
            <div class="nav-brand">Blue Cheese Robotics</div>
            
            <!-- nav links -->
            <ul class="nav-menu">
                <li><a href="./home" class="nav-link">Home</a></li>
                <li><a href="./information" class="nav-link">Information</a></li>
                <li><a href="./camera" class="nav-link">Camera</a></li>
                <li><a href="./admin" class="nav-link">Admin Panel</a></li>
            </ul>

            <!-- profile + signin -->
            <a href="./profile" id="nav-profile" class="nav-link nav-logout">Profile</a>
            <a href="./" id="nav-signin" class="nav-link nav-logout">Sign In</a>
        </div>
    </nav>

    <!-- main check-in section -->
    <main class="main-content">
        <div class="hero-section">
            
            <!-- logo -->
            <img src="./static/logo.png" alt="Blue Cheese Robotics Logo" class="logo">
            
            <!-- title -->
            <h1 class="title">Check In</h1>
            
            <!-- status text -->
            <p class="subtitle" id="member-name">Confirming attendance...</p>
    
            <!-- form fields -->
            <div class="checkin-fields">
                
                <!-- event name -->
                <label for="event-name">Event Name</label>
                <input type="text" id="event-name" placeholder="Meeting Name" required>
    
                <!-- date -->
                <label for="checkin-date">Date</label>
                <input type="date" id="checkin-date" required>
            </div>
    
            <!-- submit button -->
            <div class="button-container">
                <button class="btn btn-primary" type="button" id="submit-btn" onclick="submitAttendance()">Submit Attendance</button>
            </div>
            
            <!-- message output -->
            <p id="msg"></p>
        </div>
    </main>

    <!-- scripts -->
    <script src="./static/flasktest-submit.js"></script>
    <script src="./static/flasktest-nav.js"></script>
</body>
</html>
