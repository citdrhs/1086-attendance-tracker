<!DOCTYPE html>
<html lang="en">
<head>
    <!-- basic setup -->
    <meta charset="UTF-8">
    
    <!-- responsive screen settings -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- page title -->
    <title>1086 Attendance Tracker - Blue Cheese Robotics</title>
    
    <!-- css file -->
    <!--<link rel="stylesheet" href="/static/flasktest-style.css"> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='flasktest-style.css') }}">
    
    <!-- font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <!-- navbar -->
    <nav class="navbar">
        <div class="nav-container">
            
            <!-- brand -->
            <div class="nav-brand">Blue Cheese Robotics</div>
            
            <!-- mobile menu button -->
            <button class="hamburger" onclick="toggleMenu()">&#9776;</button>
            


            <ul class="nav-menu">
                <li><a href="{{ url_for('home') }}" class="nav-link">Home</a></li>
                <li><a href="{{ url_for('information') }}" class="nav-link">Information</a></li>
                <li><a href="{{ url_for('camera') }}" class="nav-link">Camera</a></li>
                <li><a href="{{ url_for('admin') }}" class="nav-link">Admin Panel</a></li>
                <li><a href="{{ url_for('profile') }}" class="nav-link active">Profile</a></li>
                
                <!-- mobile logout -->
                <li class="mobile-only"><a href="{{ url_for('auth') }}" class="nav-link nav-logout">Logout</a></li>
            </ul>
            
            <!-- desktop logout -->
            <a href="{{ url_for('auth') }}" id="nav-signin" class="nav-link nav-logout desktop-only">Logout</a>
        </div>
    </nav>

    <!-- main section -->
    <main class="main-content">
        <div class="hero-section">
            
            <!-- logo -->
            <img src="/static/logo.png" alt="Blue Cheese Robotics Logo" class="logo">
            
            <!-- title -->
            <h1 class="title">1086 Attendance Tracker</h1>
            
            <!-- subtitle -->
            <p class="subtitle">Deep Run High School</p>
            
            <!-- check in button -->
            <div class="button-container">
                <a href="/att1086/checkin" class="btn btn-primary" style="background: #facc15; color: #fff;">Check In</a>
            </div>
        </div>
    </main>

    <script>
        // toggle mobile menu
        function toggleMenu() {
            const navMenu = document.querySelector('.nav-menu');
            navMenu.classList.toggle('open');
        }
    </script>
</body>
</html>
